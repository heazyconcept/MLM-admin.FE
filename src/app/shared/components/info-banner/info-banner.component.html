<div
  class="flex items-start gap-3 rounded-lg border p-4"
  [class.border-amber-200]="type() === 'warning'"
  [class.bg-amber-50]="type() === 'warning'"
  [class.border-blue-200]="type() === 'info'"
  [class.bg-blue-50]="type() === 'info'"
  role="alert"
  [attr.aria-label]="type() === 'warning' ? 'Warning' : 'Information'">
  @if (type() === 'warning') {
    <i class="pi pi-exclamation-triangle text-amber-600 text-lg mt-0.5 shrink-0" aria-hidden="true"></i>
  } @else {
    <i class="pi pi-info-circle text-blue-600 text-lg mt-0.5 shrink-0" aria-hidden="true"></i>
  }
  <p class="text-sm text-gray-800" [class.text-amber-800]="type() === 'warning'">{{ message() }}</p>
</div>
