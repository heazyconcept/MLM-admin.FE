<!-- Full-screen overlay -->
<div class="fixed inset-0 z-50 flex items-stretch bg-black/40 backdrop-blur-sm animate-fadeIn">

  <!-- Panel -->
  <div class="ml-auto w-full max-w-3xl bg-white shadow-2xl flex flex-col animate-slideIn">

    <!-- Header -->
    <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between shrink-0">
      <div>
        <h2 class="text-lg font-bold text-gray-900">{{ title() }}</h2>
        <p class="text-xs text-gray-400 mt-0.5">
          {{ selectedCount() }} of {{ totalCount() }} permissions selected
        </p>
      </div>
      <button
        (click)="onCancel()"
        class="w-8 h-8 rounded-lg flex items-center justify-center
               text-gray-400 hover:text-gray-600 hover:bg-gray-100
               transition-colors duration-150">
        <i class="pi pi-times text-sm"></i>
      </button>
    </div>

    <!-- Scrollable Body -->
    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-6">

      <!-- Role Info Fields -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Role Name *</label>
          <input
            pInputText
            type="text"
            [ngModel]="roleName()"
            (ngModelChange)="roleName.set($event)"
            placeholder="e.g. Financial Officer"
            class="w-full h-10 text-sm rounded-lg border-gray-200" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Description</label>
          <textarea
            pTextarea
            [ngModel]="roleDescription()"
            (ngModelChange)="roleDescription.set($event)"
            placeholder="Brief description of what this role can do..."
            rows="2"
            class="w-full text-sm rounded-lg border-gray-200 resize-none"></textarea>
        </div>
      </div>

      <!-- Permissions Section -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-bold text-gray-900">Assign Permissions</h3>
          <div class="flex items-center gap-2">
            <button
              (click)="selectAll()"
              class="text-xs font-medium text-mlm-primary hover:text-brand-green-dark
                     transition-colors duration-150">
              Select All
            </button>
            <span class="text-gray-300">|</span>
            <button
              (click)="deselectAll()"
              class="text-xs font-medium text-gray-400 hover:text-gray-600
                     transition-colors duration-150">
              Deselect All
            </button>
          </div>
        </div>

        <!-- Search -->
        <div class="relative mb-4">
          <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input
            pInputText
            type="text"
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
            placeholder="Search permissions..."
            class="h-9 pl-9 pr-4 text-sm rounded-lg border-gray-200 w-full" />
        </div>

        <!-- Permission Groups -->
        <div class="space-y-3">
          @for (group of permissionGroups(); track group.module) {
            <div class="border border-gray-200 rounded-lg overflow-hidden">
              <!-- Module Header — toggle all -->
              <button
                (click)="toggleModule(group)"
                class="w-full flex items-center gap-3 px-4 py-3 bg-gray-50/80
                       hover:bg-gray-100/80 transition-colors duration-100 text-left">
                <div class="w-5 h-5 rounded border-2 flex items-center justify-center shrink-0 transition-colors duration-150"
                     [class.border-mlm-primary]="isModuleFullySelected(group)"
                     [class.bg-mlm-primary]="isModuleFullySelected(group)"
                     [class.border-gray-300]="!isModuleFullySelected(group) && !isModulePartiallySelected(group)"
                     [class.border-mlm-primary]="isModulePartiallySelected(group)"
                     [class.bg-mlm-primary/20]="isModulePartiallySelected(group)">
                  @if (isModuleFullySelected(group)) {
                    <i class="pi pi-check text-white text-[10px]"></i>
                  } @else if (isModulePartiallySelected(group)) {
                    <i class="pi pi-minus text-mlm-primary text-[10px]"></i>
                  }
                </div>
                <span class="text-sm font-semibold text-gray-800 flex-1">{{ group.module }}</span>
                <span class="text-[10px] font-medium text-gray-400 bg-gray-200/80 px-1.5 py-0.5 rounded">
                  {{ group.permissions.length }}
                </span>
              </button>

              <!-- Individual Permissions -->
              <div class="divide-y divide-gray-100">
                @for (perm of group.permissions; track perm.id) {
                  <button
                    (click)="togglePermission(perm.id)"
                    class="w-full flex items-center gap-3 px-4 py-2.5 text-left
                           hover:bg-blue-50/40 transition-colors duration-100"
                    [class.bg-mlm-green-50/30]="isSelected(perm.id)">
                    <div class="w-4 h-4 rounded border-2 flex items-center justify-center shrink-0 transition-colors duration-150"
                         [class.border-mlm-primary]="isSelected(perm.id)"
                         [class.bg-mlm-primary]="isSelected(perm.id)"
                         [class.border-gray-300]="!isSelected(perm.id)">
                      @if (isSelected(perm.id)) {
                        <i class="pi pi-check text-white text-[8px]"></i>
                      }
                    </div>
                    <div class="flex-1 min-w-0">
                      <p class="text-sm text-gray-800 font-medium">{{ perm.label }}</p>
                      @if (perm.description) {
                        <p class="text-[10px] text-gray-500 mt-0.5 truncate">{{ perm.description }}</p>
                      }
                    </div>
                    <span
                      class="text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded border shrink-0"
                      [class.bg-blue-50]="perm.type === 'view'"
                      [class.text-blue-600]="perm.type === 'view'"
                      [class.border-blue-200]="perm.type === 'view'"
                      [class.bg-amber-50]="perm.type === 'action'"
                      [class.text-amber-600]="perm.type === 'action'"
                      [class.border-amber-200]="perm.type === 'action'">
                      {{ perm.type }}
                    </span>
                  </button>
                }
              </div>
            </div>
          }
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between shrink-0 bg-white">
      <p class="text-xs text-gray-400">
        <span class="font-semibold text-gray-600">{{ selectedCount() }}</span> permissions assigned
      </p>
      <div class="flex items-center gap-3">
        <button
          (click)="onCancel()"
          class="h-9 px-5 rounded-lg border border-gray-300 text-sm font-medium
                 text-gray-600 bg-white hover:border-gray-400 hover:text-gray-800
                 transition-colors duration-150">
          Cancel
        </button>
        <button
          (click)="onSave()"
          [disabled]="!canSave() || saving()"
          class="h-9 px-5 rounded-lg text-sm font-semibold text-white
                 bg-mlm-primary border border-mlm-primary
                 hover:bg-brand-green-dark hover:border-brand-green-dark
                 disabled:opacity-40 disabled:cursor-not-allowed
                 flex items-center gap-2 transition-colors duration-150">
          @if (saving()) {
            <i class="pi pi-spin pi-spinner text-xs"></i>
          }
          {{ isEditing() ? 'Update Role' : 'Create Role' }}
        </button>
      </div>
    </div>
  </div>
</div>
