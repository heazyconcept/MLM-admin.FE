<p-dialog
  [visible]="visible()"
  [modal]="true"
  header="Password Reset Successful"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
  [style]="{ width: '450px' }"
  styleClass="modern-dialog"
  (onHide)="onClose()">

  <div class="flex flex-col items-center text-center gap-5 py-2">
    <div class="w-14 h-14 rounded-full bg-emerald-50 flex items-center justify-center">
      <i class="pi pi-check-circle text-2xl text-mlm-success" aria-hidden="true"></i>
    </div>

    <p class="text-sm text-mlm-text leading-relaxed">
      Password for <span class="font-semibold text-gray-900">{{ fullName() }}</span> has been reset successfully.
    </p>

    <div class="w-full space-y-2">
      <label
        for="temp-password-display"
        class="block text-[10px] font-semibold tracking-[0.1em] uppercase text-gray-400">
        Temporary Password
      </label>
      <input
        id="temp-password-display"
        type="text"
        readonly
        [value]="temporaryPassword()"
        aria-live="polite"
        class="w-full h-11 px-4 text-center text-base font-mono font-semibold tracking-wide
               text-gray-900 bg-gray-50 border border-gray-200 rounded-lg
               focus:outline-none focus:ring-2 focus:ring-mlm-primary/40 select-all" />
      <p class="text-xs text-amber-600 font-medium">
        Share this password securely. The user will be required to change it on next login.
      </p>
    </div>
  </div>

  <ng-template #footer>
    <div class="flex justify-end">
      <button
        pButton
        type="button"
        label="Done"
        class="p-button-primary"
        autofocus
        (click)="onClose()">
      </button>
    </div>
  </ng-template>
</p-dialog>
