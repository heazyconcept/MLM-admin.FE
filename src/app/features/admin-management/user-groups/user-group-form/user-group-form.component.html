<!-- Full-screen overlay -->
<div class="fixed inset-0 z-50 flex items-stretch bg-black/40 backdrop-blur-sm animate-fadeIn">

  <!-- Panel -->
  <div class="ml-auto w-full max-w-2xl bg-white shadow-2xl flex flex-col animate-slideIn">

    <!-- Header -->
    <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between shrink-0">
      <h2 class="text-lg font-bold text-gray-900">{{ title() }}</h2>
      <button
        (click)="onCancel()"
        class="w-8 h-8 rounded-lg flex items-center justify-center
               text-gray-400 hover:text-gray-600 hover:bg-gray-100
               transition-colors duration-150">
        <i class="pi pi-times text-sm"></i>
      </button>
    </div>

    <!-- Scrollable Body -->
    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-6">

      <!-- Group Info -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Group Name *</label>
          <input
            pInputText
            type="text"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            placeholder="e.g. Finance Team"
            class="w-full h-10 text-sm rounded-lg border-gray-200" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Description</label>
          <textarea
            pTextarea
            [ngModel]="description()"
            (ngModelChange)="description.set($event)"
            placeholder="What does this group do..."
            rows="2"
            class="w-full text-sm rounded-lg border-gray-200 resize-none"></textarea>
        </div>
      </div>

      <!-- Role Assignment -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-bold text-gray-900">Assign Roles *</h3>
          <span class="text-xs text-gray-400">
            <span class="font-semibold text-gray-600">{{ totalPermissions() }}</span> total permissions
          </span>
        </div>

        @if (availableRoles.length === 0) {
          <div class="flex flex-col items-center justify-center py-8 text-gray-400 bg-gray-50 rounded-lg">
            <i class="pi pi-info-circle text-xl mb-2"></i>
            <p class="text-sm">No roles available. Create roles first.</p>
          </div>
        } @else {
          <div class="space-y-2">
            @for (role of availableRoles; track role.id) {
              <button
                (click)="toggleRole(role.id)"
                class="w-full flex items-center gap-3 p-3 rounded-lg border
                       text-left transition-all duration-150"
                [class.border-mlm-primary]="isRoleSelected(role.id)"
                [class.bg-mlm-green-50/30]="isRoleSelected(role.id)"
                [class.border-gray-200]="!isRoleSelected(role.id)"
                [class.hover:border-gray-300]="!isRoleSelected(role.id)"
                [class.hover:bg-gray-50]="!isRoleSelected(role.id)">
                <div class="w-4 h-4 rounded border-2 flex items-center justify-center shrink-0 transition-colors duration-150"
                     [class.border-mlm-primary]="isRoleSelected(role.id)"
                     [class.bg-mlm-primary]="isRoleSelected(role.id)"
                     [class.border-gray-300]="!isRoleSelected(role.id)">
                  @if (isRoleSelected(role.id)) {
                    <i class="pi pi-check text-white text-[8px]"></i>
                  }
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-semibold text-gray-800">{{ role.name }}</p>
                  <p class="text-xs text-gray-400 mt-0.5 truncate">{{ role.description }}</p>
                </div>
                <span class="text-[10px] font-medium text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded shrink-0">
                  {{ role.permissions.length }} perms
                </span>
              </button>
            }
          </div>
        }
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between shrink-0 bg-white">
      <p class="text-xs text-gray-400">
        <span class="font-semibold text-gray-600">{{ selectedRoleIds().size }}</span> roles selected
      </p>
      <div class="flex items-center gap-3">
        <button
          (click)="onCancel()"
          class="h-9 px-5 rounded-lg border border-gray-300 text-sm font-medium
                 text-gray-600 bg-white hover:border-gray-400 hover:text-gray-800
                 transition-colors duration-150">
          Cancel
        </button>
        <button
          (click)="onSave()"
          [disabled]="!canSave() || saving()"
          class="h-9 px-5 rounded-lg text-sm font-semibold text-white
                 bg-mlm-primary border border-mlm-primary
                 hover:bg-brand-green-dark hover:border-brand-green-dark
                 disabled:opacity-40 disabled:cursor-not-allowed
                 flex items-center gap-2 transition-colors duration-150">
          @if (saving()) {
            <i class="pi pi-spin pi-spinner text-xs"></i>
          }
          {{ isEditing() ? 'Update Group' : 'Create Group' }}
        </button>
      </div>
    </div>
  </div>
</div>
