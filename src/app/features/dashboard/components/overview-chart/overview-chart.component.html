<div class="bg-white rounded-xl px-5 py-5 border border-slate-200 h-full
            hover:shadow-[0_2px_16px_rgba(0,0,0,0.06)] transition-shadow duration-200">

  <!-- Header -->
  <div class="flex items-start justify-between mb-5">
    <div>
      <p class="text-[10px] font-semibold tracking-[0.12em] text-slate-400 uppercase mb-1">
        {{ title() }}
      </p>
      <p class="text-2xl font-bold text-mlm-text tracking-tight tabular-nums leading-none">
        {{ totalValue() }}
      </p>
    </div>
    <span class="text-[10px] font-medium text-slate-400 mt-1 shrink-0">
      @if (loading()) { Loading… }
      @else { Last 30 days }
    </span>
  </div>

  <!-- Chart -->
  <div class="h-56">
    <p-chart
      type="bar"
      [data]="data()"
      [options]="options()"
      styleClass="h-full w-full">
    </p-chart>
  </div>

</div>
