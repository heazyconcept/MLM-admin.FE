<ng-template #cardInner>
  <div class="bg-white rounded-xl px-5 py-5 border border-slate-200 h-full min-h-[100px]
              hover:shadow-[0_2px_16px_rgba(0,0,0,0.06)] transition-shadow duration-200">

    @if (loading()) {
      <div class="animate-pulse flex flex-col gap-3">
        <div class="w-20 h-2.5 rounded bg-slate-200"></div>
        <div class="w-32 h-9 rounded bg-slate-200"></div>
        <div class="w-24 h-3 rounded bg-slate-200"></div>
      </div>
    } @else {
      <!-- Title -->
      <p class="text-[10px] font-semibold tracking-[0.12em] text-slate-400 uppercase mb-3">
        {{ title() }}
      </p>

      @if (subtitle()) {
        <p class="text-[11px] text-slate-400 -mt-2 mb-3">{{ subtitle() }}</p>
      }

      <!-- Value -->
      <p class="text-3xl font-bold text-mlm-text tracking-tight tabular-nums leading-none mb-3">
        {{ value() }}
      </p>

      <!-- Change indicator -->
      @if (change() !== null) {
        <div class="flex items-center gap-1.5">
          <span class="flex items-center gap-1 text-xs font-semibold"
                [class.text-mlm-primary]="isPositive()"
                [class.text-mlm-error]="!isPositive()">
            <i class="pi text-[10px]"
               [class.pi-arrow-up]="isPositive()"
               [class.pi-arrow-down]="!isPositive()"></i>
            {{ changeFormatted() }}
          </span>
          <span class="text-xs text-slate-400">{{ changeLabel() }}</span>
        </div>
      }
    }

  </div>
</ng-template>

@if (routerLink(); as link) {
  <a [routerLink]="link"
     class="block h-full no-underline text-inherit rounded-xl
            focus:outline-none focus-visible:ring-2 focus-visible:ring-mlm-primary/30">
    <ng-container *ngTemplateOutlet="cardInner"></ng-container>
  </a>
} @else {
  <ng-container *ngTemplateOutlet="cardInner"></ng-container>
}
