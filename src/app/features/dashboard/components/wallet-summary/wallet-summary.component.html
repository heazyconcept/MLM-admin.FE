<div class="min-h-full rounded-lg border border-slate-200/70 bg-white p-6">
  <div class="mb-5">
    <h3 class="text-xs font-semibold uppercase tracking-[0.12em] text-slate-500">Wallet balances</h3>
    <p class="text-[13px] text-slate-400 mt-0.5">Platform totals by type</p>
  </div>

  <div class="pb-4 mb-4 border-b border-slate-100">
    <p class="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Combined</p>
    <p class="text-2xl font-semibold text-slate-800 tabular-nums tracking-tight">{{ totalBalance() }}</p>
  </div>

  <div class="space-y-0 divide-y divide-slate-100">
    @for (wallet of wallets(); track wallet.label) {
      <div class="flex items-baseline justify-between gap-4 py-3 first:pt-0">
        <div class="min-w-0">
          <p class="text-sm text-slate-800">{{ wallet.label }}</p>
          <p class="text-[11px] text-slate-400 mt-0.5">{{ wallet.type }}</p>
        </div>
        <span class="text-sm font-medium text-slate-800 tabular-nums shrink-0">{{ wallet.balance }}</span>
      </div>
    }
  </div>
</div>
