<p-toast></p-toast>

<div class="p-8 font-geist min-h-screen bg-mlm-background">

  <!-- ── Header ── -->
  <div class="flex items-start justify-between gap-4 mb-8">
    <div>
      <h1 class="text-[26px] font-bold tracking-tight text-mlm-text leading-tight mb-1">
        User Management
      </h1>
      <p class="text-sm text-mlm-secondary">View and manage all registered users</p>
    </div>

    <button
      (click)="onExport()"
      class="h-9 px-4 rounded-lg border border-slate-300 text-sm font-medium
             text-mlm-secondary bg-white hover:border-slate-400 hover:text-mlm-text
             flex items-center gap-2 transition-colors duration-150 shrink-0 mt-1">
      <i class="pi pi-download text-xs"></i>
      Export
    </button>
  </div>

  <!-- ── Single Card: Filters + Table ── -->
  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">

    <!-- Filter Bar -->
    <div class="px-5 py-4 border-b border-slate-100">
      <div class="flex flex-col lg:flex-row lg:items-center gap-3">

        <!-- Search -->
        <div class="relative flex-1 max-w-xs">
          <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2
                    text-slate-400 text-xs pointer-events-none"></i>
          <input
            type="text"
            placeholder="Search users…"
            class="w-full h-9 pl-8 pr-3 rounded-lg border border-slate-200 text-sm
                   text-mlm-text bg-white placeholder:text-slate-300
                   focus:outline-none focus:ring-2 focus:ring-mlm-primary transition"
            [ngModel]="globalFilter()"
            (ngModelChange)="globalFilter.set($event)" />
        </div>

        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-2">

          <p-select
            [options]="statusOptions"
            [ngModel]="statusFilter()"
            (ngModelChange)="statusFilter.set($event)"
            placeholder="All Statuses"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="!h-9 !text-sm !rounded-lg !border-slate-200 w-36">
          </p-select>

          <p-select
            [options]="packageOptions"
            [ngModel]="packageFilter()"
            (ngModelChange)="packageFilter.set($event)"
            placeholder="All Packages"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="!h-9 !text-sm !rounded-lg !border-slate-200 w-36">
          </p-select>

          <p-select
            [options]="roleOptions"
            [ngModel]="roleFilter()"
            (ngModelChange)="roleFilter.set($event)"
            placeholder="All Roles"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="!h-9 !text-sm !rounded-lg !border-slate-200 w-32">
          </p-select>

          <p-datepicker
            [ngModel]="dateRange()"
            (ngModelChange)="dateRange.set($event)"
            selectionMode="range"
            placeholder="Joined date range"
            [showIcon]="true"
            iconDisplay="input"
            appendTo="body"
            inputStyleClass="h-9 text-sm border-slate-200 rounded-lg w-48">
          </p-datepicker>

          <div class="h-5 w-px bg-slate-200 mx-1 hidden sm:block"></div>

          <button
            (click)="clearFilters()"
            pTooltip="Clear filters"
            tooltipPosition="top"
            class="w-9 h-9 flex items-center justify-center rounded-lg
                   border border-slate-200 text-slate-400
                   hover:border-slate-300 hover:text-mlm-text
                   transition-colors duration-150">
            <i class="pi pi-filter-slash text-xs"></i>
          </button>

        </div>
      </div>
    </div>

    <!-- Table — 7 <td> matching 7 headers: ID · User · Email · Role · Package · Status · Joined -->
    <app-data-table
      [value]="filteredUsers()"
      [headers]="tableHeaders()"
      [loading]="tableLoading()">

      <ng-template pTemplate="body" let-row>
        <tr class="border-b border-slate-100 hover:bg-slate-50/60
                   transition-colors duration-100 cursor-pointer"
            (click)="viewProfile(row)">

          <!-- ID → columns[0] field: 'id' -->
          <td class="px-5 py-3.5 w-[100px]">
            <span class="text-[11px] font-mono text-slate-400">
              {{ row.id | slice:0:8 }}…
            </span>
          </td>

          <!-- User → columns[1] field: 'fullName' -->
          <td class="px-5 py-3.5 min-w-[180px]">
            <p class="text-sm font-semibold text-mlm-text leading-tight">
              {{ row.fullName || 'None' }}
            </p>
            <p class="text-[11px] font-mono text-slate-400 mt-0.5">
              &#64;{{ row.username }}
            </p>
          </td>

          <!-- Email → columns[2] field: 'email' -->
          <td class="px-5 py-3.5">
            <span class="text-sm text-mlm-secondary">{{ row.email || 'none' }}</span>
          </td>

          <!-- Role → columns[3] field: 'role' -->
          <td class="px-5 py-3.5 w-[120px]">
            <span class="text-sm text-mlm-secondary">{{ row.role || 'None' }}</span>
          </td>

          <!-- Package → columns[4] field: 'package' -->
          <td class="px-5 py-3.5 w-[130px]">
            <span
              class="inline-flex items-center px-2.5 py-0.5 rounded-md
                     text-[11px] font-semibold tracking-wide uppercase"
              [style.background-color]="getPackageColor(row.package) + '18'"
              [style.color]="getPackageColor(row.package)">
              {{ row.package }}
            </span>
          </td>

          <!-- Status → columns[5] field: 'status' -->
          <td class="px-5 py-3.5 w-[130px]">
            <app-status-badge [status]="row.status"></app-status-badge>
          </td>

          <!-- Joined → columns[6] field: 'registrationDate' (not createdAt) -->
          <td class="px-5 py-3.5 w-[160px]">
            <span class="text-xs font-mono text-slate-400 tabular-nums">
              {{ row.registrationDate | date:'MMM d, y' }}
            </span>
          </td>

        </tr>
      </ng-template>

    </app-data-table>

  </div>
</div>

<!-- User Profile Modal -->
<app-user-profile-modal
  [visible]="profileModalVisible()"
  (visibleChange)="profileModalVisible.set($event)"
  [user]="selectedUser()"
  (actionClick)="onProfileAction($event)">
</app-user-profile-modal>

<!-- Confirmation Modal -->
<app-confirmation-modal
  [(visible)]="actionConfig.visible"
  [title]="actionConfig.title"
  [message]="actionConfig.message"
  [icon]="actionConfig.icon"
  [iconClass]="actionConfig.iconClass"
  [confirmLabel]="actionConfig.confirmLabel"
  [confirmClass]="actionConfig.confirmClass"
  [loading]="actionLoading()"
  [showReasonField]="actionConfig.showReasonField"
  [reasonRequired]="actionConfig.reasonRequired"
  (confirm)="onActionConfirm($event)"
  (cancel)="onActionCancel()">
</app-confirmation-modal>
