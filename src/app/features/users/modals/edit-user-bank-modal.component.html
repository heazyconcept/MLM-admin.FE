<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [header]="'Bank details — ' + userName()"
  [style]="{ width: '32rem' }"
  (onHide)="onCancel()">
  <form [formGroup]="form" class="space-y-4" (ngSubmit)="onSubmit()">
    <p class="text-xs text-slate-500">
      Updates the member payout account used for withdrawals. Changes are audited.
    </p>

    <div>
      <label for="edit-bank-name" class="block text-sm font-medium text-gray-700 mb-1">
        Bank name
      </label>
      <input
        id="edit-bank-name"
        pInputText
        type="text"
        formControlName="bankName"
        class="w-full"
        [disabled]="loading()"
        autocomplete="organization">
    </div>

    <div>
      <label for="edit-account-number" class="block text-sm font-medium text-gray-700 mb-1">
        Account number
      </label>
      <input
        id="edit-account-number"
        pInputText
        type="text"
        inputmode="numeric"
        formControlName="accountNumber"
        class="w-full font-mono"
        [disabled]="loading()"
        autocomplete="off">
      @if (form.controls.accountNumber.invalid && form.controls.accountNumber.touched) {
        <p class="text-xs text-mlm-error mt-1">Account number must be 10–20 digits.</p>
      }
    </div>

    <div>
      <label for="edit-account-name" class="block text-sm font-medium text-gray-700 mb-1">
        Account name
      </label>
      <input
        id="edit-account-name"
        pInputText
        type="text"
        formControlName="accountName"
        class="w-full"
        [disabled]="loading()"
        autocomplete="name">
    </div>

    <div>
      <label for="edit-account-type" class="block text-sm font-medium text-gray-700 mb-1">
        Account type
      </label>
      <p-select
        inputId="edit-account-type"
        [options]="accountTypeOptions"
        formControlName="accountType"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        [disabled]="loading()">
      </p-select>
    </div>

    <div>
      <label for="edit-bank-reason" class="block text-sm font-medium text-gray-700 mb-1">
        Reason (optional)
      </label>
      <textarea
        id="edit-bank-reason"
        pTextarea
        rows="2"
        class="w-full"
        formControlName="reason"
        [disabled]="loading()"
        placeholder="Support ticket or correction note">
      </textarea>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cancel"
      class="p-button-outlined"
      [disabled]="loading()"
      (click)="onCancel()">
    </button>
    <button
      pButton
      type="button"
      label="Save bank details"
      class="p-button-primary"
      [disabled]="form.invalid || loading()"
      [loading]="loading()"
      (click)="onSubmit()">
    </button>
  </ng-template>
</p-dialog>
