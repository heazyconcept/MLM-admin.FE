<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [header]="'Credit volume — ' + userName()"
  [style]="{ width: '28rem' }"
  (onHide)="onCancel()">
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Volume type</label>
      <p-select
        [options]="volumeTypeOptions"
        [(ngModel)]="volumeType"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        [disabled]="submitting">
      </p-select>
      @if (volumeType === 'CPV') {
        <p class="text-xs text-amber-600 mt-1">CPV credits may trigger milestone bonus calculations.</p>
      }
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Amount</label>
      <p-inputNumber
        [(ngModel)]="amount"
        [min]="0.01"
        [max]="999999999"
        [mode]="'decimal'"
        [minFractionDigits]="1"
        [maxFractionDigits]="2"
        [disabled]="submitting"
        styleClass="w-full">
      </p-inputNumber>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Reason</label>
      <textarea
        pTextarea
        rows="3"
        class="w-full"
        [(ngModel)]="reason"
        [disabled]="submitting"
        placeholder="Correction for ... (min 10 chars)">
      </textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">External reference (optional)</label>
      <input
        pInputText
        type="text"
        class="w-full"
        [(ngModel)]="externalReference"
        [disabled]="submitting"
        placeholder="ticket-12345-cpv">
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cancel"
      class="p-button-outlined"
      [disabled]="submitting"
      (click)="onCancel()">
    </button>
    <button
      pButton
      type="button"
      [label]="'Credit ' + volumeType"
      class="p-button-primary"
      [disabled]="!amount || amount <= 0 || reason.trim().length < 10 || submitting"
      [loading]="submitting"
      (click)="onConfirm()">
    </button>
  </ng-template>
</p-dialog>
