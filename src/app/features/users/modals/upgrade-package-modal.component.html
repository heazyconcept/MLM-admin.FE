<p-dialog
  [visible]="visible()"
  [modal]="true"
  [header]="'Upgrade package — ' + userName()"
  [style]="{ width: '28rem' }"
  (onHide)="onDialogHide()">
  <div class="space-y-4">
    <div>
      <p class="text-sm text-gray-500 mb-3">Current package: <strong>{{ currentPackage() }}</strong></p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Target package</label>
      <p-select
        [options]="availablePackages"
        [(ngModel)]="targetPackage"
        optionLabel="label"
        optionValue="value"
        placeholder="Select target package"
        styleClass="w-full"
        [disabled]="submitting() || availablePackages.length === 0">
      </p-select>
      @if (availablePackages.length === 0) {
        <p class="text-xs text-amber-600 mt-1">User already has the highest package.</p>
      }
    </div>

    <div class="flex items-center gap-3">
      <p-toggleSwitch [(ngModel)]="waivePayment" [disabled]="submitting()"></p-toggleSwitch>
      <div>
        <p class="text-sm font-medium text-gray-700">Waive payment</p>
        <p class="text-xs text-gray-500">Skip payment and upgrade immediately.</p>
      </div>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cancel"
      class="p-button-outlined"
      [disabled]="submitting()"
      (click)="onCancel()">
    </button>
    <button
      pButton
      type="button"
      label="Upgrade package"
      class="p-button-primary"
      [disabled]="!targetPackage || submitting()"
      [loading]="submitting()"
      (click)="onConfirm()">
    </button>
  </ng-template>
</p-dialog>
