<div class="min-h-screen bg-mlm-background font-geist p-8">

  <!-- ── Header ── -->
  <div class="flex items-start justify-between gap-4 mb-8">
    <div>
      <h1 class="text-[26px] font-bold tracking-tight text-mlm-text leading-tight mb-1">
        Wallet Management
      </h1>
      <p class="text-sm text-mlm-secondary">View and manage user wallets and balances</p>
    </div>

    <button
      (click)="onExport()"
      class="h-9 px-4 rounded-lg border border-slate-300 text-sm font-medium
             text-mlm-secondary bg-white hover:border-slate-400 hover:text-mlm-text
             flex items-center gap-2 transition-colors duration-150 shrink-0 mt-1">
      <i class="pi pi-download text-xs"></i>
      Export
    </button>
  </div>

  <!-- ── Single Card: Search + Table ── -->
  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">

    <!-- Search Bar -->
    <div class="px-5 py-4 border-b border-slate-100">
      <div class="relative max-w-xs">
        <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2
                  text-slate-400 text-xs pointer-events-none"></i>
        <input
          type="text"
          placeholder="Search wallets…"
          class="w-full h-9 pl-8 pr-3 rounded-lg border border-slate-200 text-sm
                 text-mlm-text bg-white placeholder:text-slate-300
                 focus:outline-none focus:ring-2 focus:ring-mlm-primary transition"
          (input)="onSearch($event)" />
      </div>
    </div>

    <!-- Table — 7 <td> matching headers:
         WALLET ID · USER · TYPE · BALANCE · STATUS · LAST UPDATED · ACTIONS -->
    <app-data-table
      [value]="filteredWallets()"
      [headers]="tableHeaders"
      [rows]="tableRows"
      [rowsPerPageOptions]="tableRowsPerPageOptions"
      [loading]="loading()">

      <ng-template pTemplate="body" let-wallet>
        <tr class="border-b border-slate-100 hover:bg-slate-50/60
                   transition-colors duration-100 cursor-pointer"
            (click)="router.navigate(['/admin/wallets', wallet.id])">

          <!-- Wallet ID -->
          <td class="px-5 py-3.5 w-[120px]">
            <span class="text-[11px] font-mono text-slate-400">
              {{ wallet.id }}
            </span>
          </td>

          <!-- User -->
          <td class="px-5 py-3.5 w-[220px]">
            <p class="text-sm font-semibold text-mlm-text leading-tight">
              {{ wallet.userName }}
            </p>
            <p class="text-[11px] font-mono text-slate-400 mt-0.5">
              {{ wallet.userId }}
            </p>
          </td>

          <!-- Type -->
          <td class="px-5 py-3.5 w-[110px]">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-md
                         text-[10px] font-bold tracking-[0.08em] uppercase
                         bg-slate-100 text-slate-600 border border-slate-200">
              {{ wallet.type }}
            </span>
          </td>

          <!-- Balance -->
          <td class="px-5 py-3.5 w-[140px] text-right">
            <span class="text-sm font-semibold font-mono text-mlm-text tabular-nums">
              {{ wallet.balance | currency:wallet.currency:'symbol-narrow' }}
            </span>
          </td>

          <!-- Status — uses app-status-badge for consistency -->
          <td class="px-5 py-3.5 w-[120px]">
            <app-status-badge [status]="wallet.status"></app-status-badge>
          </td>

          <!-- Last Updated -->
          <td class="px-5 py-3.5 w-[140px]">
            <span class="text-xs font-mono text-slate-400 tabular-nums">
              {{ wallet.lastUpdated | date:'MMM d, y' }}
            </span>
          </td>

          <!-- Actions — stop propagation so row click doesn't also fire -->
          <td class="px-5 py-3.5 w-[80px]" (click)="$event.stopPropagation()">
            <div class="flex items-center justify-center">
              <button
                (click)="router.navigate(['/admin/wallets', wallet.id])"
                pTooltip="View Details" tooltipPosition="top"
                class="w-8 h-8 rounded-lg flex items-center justify-center
                       text-slate-400 hover:text-mlm-primary hover:bg-slate-100
                       transition-colors duration-150">
                <i class="pi pi-eye text-xs"></i>
              </button>
            </div>
          </td>

        </tr>
      </ng-template>

    </app-data-table>

  </div>
</div>
