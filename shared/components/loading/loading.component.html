@if (loadingService.isLoading()) {
  <div
    class="absolute inset-0 z-20 flex items-center justify-center bg-black/30 backdrop-blur-sm"
    aria-live="polite"
    aria-busy="true">
    <div class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-primary-color border-t-transparent"></div>
  </div>
}
